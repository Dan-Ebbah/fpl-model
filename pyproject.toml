[project]
name = "fpl-model"
version = "0.1.0"
description = "FPL expected-points model and squad optimizer (port of the Excel model to Python)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "pulp>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
fpl = "fpl_model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
